<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра — 5 животных</title>
  <style>
    html { overflow: hidden; max-height: 100vh !important; overscroll-behavior: none !important; }
    body { margin:0; font-family: Arial, sans-serif; overflow: hidden !important; max-height: 100vh !important; overscroll-behavior: none !important;  background: transparent; text-align:center; }
    #game-screen { border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    #game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 15px; font-size: 1.1rem; }
    canvas {
        width: 100% !important;
        max-height: inherit;
        display: block;
        background: transparent;
        position: absolute;
        z-index: 3;
        align-items: flex-end;
    }
    button { padding: 10px 24px; font-size: 16px; margin: 12px 8px; border: none; border-radius: 8px; cursor: pointer; }
    #restart {
        background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        color: white;
        padding: 14px 32px;
        font-size: 1.3rem;
        border-radius: 999px;
        box-shadow: 0 8px 25px rgba(255, 107, 107, 0.649);
        transition: all 0.3s ease;
    }
    #restart:hover { transform: scale(1.08) translateY(-3px); }
    .basket-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 700px;
        margin-left: 31px;
    }
    .basket-image {
        width: 85%; 
        max-width: 700px;
        height: auto;
        object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="game-screen">
    <div id="game-header">
      <div><strong>Счёт:</strong> <span id="score">0</span></div>
      <div><strong>Следующее:</strong> <img id="next-animal" width="64" height="64" style="vertical-align:middle; border-radius:50%;"></div>
    </div>
    <div id="canvas-container" style="
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 150%;           /* 960 / 640 = 1.5 → 150% */
        background: transparent;
        border-radius: 0 0 12px 12px;
        overflow: hidden;
    "> <canvas id="game-canvas"></canvas>
    <img 
        src="../images/game-area.png" 
        alt="Корзина" 
        class="basket-overlay"
    ></div>
    <button id="restart" onclick="restartGame()" style="display:none;">Играть заново</button>
  </div>

  <script src="matter.js"></script>
  <script src="script.js"></script>
</body>
</html>
